title: Today I Learned
description: 매일 배우고 이해한 것을 기록하는 개발 학습 노트
url: "https://yshzjq.github.io"
baseurl: "/TIL"

lang: ko-KR
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge

# GitHub Pages가 처리할 필요가 없는 저장소 파일
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "machine-learning"
    values:
      layout: post
      category: Machine Learning
      til: true
  - scope:
      path: "deep-learning"
    values:
      layout: post
      category: 딥러닝 기초
      til: true
  - scope:
      path: "deep-learning-advanced"
    values:
      layout: post
      category: 딥러닝 심화
      til: true
  - scope:
      path: "math"
    values:
      layout: post
      category: Math
      til: true
      math: true
  - scope:
      path: "python"
    values:
      layout: post
      category: Python
      til: true
