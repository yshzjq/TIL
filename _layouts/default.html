<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8fafc">
    <title>{% if page.title and page.title != '홈' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    {% assign asset_version = site.github.build_revision | default: '2' %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="TIL 홈">
          <span class="brand-mark">T</span>
          <span class="brand-text">Today I Learned</span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <div class="header-search" data-search data-index-url="{{ '/search.json' | relative_url }}?v={{ asset_version }}">
            <form class="search-form" role="search">
              <label class="visually-hidden" for="site-search">TIL 검색</label>
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/>
              </svg>
              <input id="site-search" type="search" placeholder="검색" autocomplete="off" aria-controls="search-results" aria-expanded="false">
              <button class="search-clear" type="button" aria-label="검색어 지우기" hidden>×</button>
            </form>
            <div class="search-results" id="search-results" role="listbox" aria-label="검색 결과" hidden>
              <p class="search-status" aria-live="polite">검색어를 입력해 주세요.</p>
              <div class="search-result-list"></div>
            </div>
          </div>
          <a{% if page.url == '/' %} class="active"{% endif %} href="{{ '/' | relative_url }}">홈</a>
          <a{% if page.url == '/categories/' %} class="active"{% endif %} href="{{ '/categories/' | relative_url }}">카테고리</a>
          <a class="github-link" href="https://github.com/yshzjq/TIL" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소 열기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.23.7-3.91-1.37-3.91-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.58-.3-5.29-1.29-5.29-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.23 2.76.11 3.05a4.45 4.45 0 0 1 1.19 3.09c0 4.42-2.72 5.39-5.3 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
          </a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <strong>Today I Learned</strong>
        <p>배운 것을 기록하고, 기록한 것을 다시 배웁니다.</p>
      </div>
      <p>© {{ 'now' | date: '%Y' }} TIL · Built with GitHub Pages</p>
    </footer>
    <script src="{{ '/assets/js/search.js' | relative_url }}?v={{ asset_version }}" defer></script>
  </body>
</html>
