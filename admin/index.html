<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>TIL 콘텐츠 관리</title>
  </head>
  <body>
    <noscript>콘텐츠 편집기를 사용하려면 JavaScript를 활성화해 주세요.</noscript>
    <script src="https://unpkg.com/@sveltia/cms@0.172.4/dist/sveltia-cms.js"></script>
    <script>
      const getSeoulDate = () => {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date());
        const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
        return `${values.year}-${values.month}-${values.day}`;
      };

      CMS.registerEventListener({
        name: "preSave",
        handler: ({ entry }) => entry.get("data").set("updated", getSeoulDate()),
      });
    </script>
  </body>
</html>
